<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>گزارش نماز | لیمو شیرین</title>

  <style>
    :root {
      --bg: #f5f8f6;
      --surface: #ffffff;
      --surface-soft: #f0f8f3;
      --text: #17251d;
      --muted: #64748b;
      --border: #dfe9e3;
      --primary: #16965d;
      --primary-dark: #087447;
      --primary-light: #dcfce7;
      --shadow: 0 12px 35px rgba(20, 63, 40, 0.10);
      --danger: #dc2626;
      --warning: #d97706;
    }

    body.dark {
      --bg: #0d1712;
      --surface: #14241b;
      --surface-soft: #1b3125;
      --text: #eefcf4;
      --muted: #b5c8bb;
      --border: #2c4939;
      --primary: #36c981;
      --primary-dark: #1fab68;
      --primary-light: #153c28;
      --shadow: 0 12px 35px rgba(0, 0, 0, 0.28);
      --danger: #fb7185;
      --warning: #fbbf24;
    }

    * {
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(34, 197, 94, 0.16), transparent 28%),
        radial-gradient(circle at bottom left, rgba(250, 204, 21, 0.12), transparent 28%),
        var(--bg);
      transition: background 0.25s, color 0.25s;
    }

    .container {
      width: min(920px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 36px;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lemon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      font-size: 29px;
      border-radius: 18px;
      background: linear-gradient(135deg, #fef08a, #facc15);
      box-shadow: 0 8px 20px rgba(202, 138, 4, 0.2);
    }

    h1 {
      margin: 0;
      font-size: clamp(21px, 4vw, 29px);
      color: var(--text);
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .theme-btn {
      border: 1px solid var(--border);
      color: var(--text);
      background: var(--surface);
      border-radius: 14px;
      padding: 10px 13px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .card {
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 22px;
      margin-bottom: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select,
    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      outline: none;
      transition: 0.2s;
    }

    select,
    input {
      padding: 13px;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(22, 150, 93, 0.12);
    }

    .hidden {
      display: none !important;
    }

    .progress-box {
      background: var(--surface-soft);
      border-radius: 16px;
      padding: 13px 15px;
      margin: 20px 0;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 9px;
    }

    .progress-track {
      height: 8px;
      border-radius: 20px;
      overflow: hidden;
      background: var(--border);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      transition: width 0.25s ease;
      background: linear-gradient(90deg, #22c55e, #16a34a);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 23px 0 12px;
      font-size: 18px;
      font-weight: bold;
    }

    .section-title::before {
      content: "";
      width: 5px;
      height: 23px;
      border-radius: 10px;
      background: var(--primary);
    }

    .period {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 13px;
    }

    .period-title {
      margin: 0 0 13px;
      color: var(--primary-dark);
      font-size: 16px;
    }

    body.dark .period-title {
      color: var(--primary);
    }

    .prayers-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
    }

    .prayer {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 13px;
    }

    .prayer-name {
      margin: 0 0 10px;
      font-weight: bold;
      font-size: 14px;
    }

    .status-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }

    .status-btn {
      border: 1px solid var(--border);
      color: var(--text);
      background: var(--surface-soft);
      border-radius: 10px;
      padding: 9px 5px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: 0.18s;
    }

    .status-btn:hover {
      transform: translateY(-1px);
      border-color: var(--primary);
    }

    .status-btn.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(22, 150, 93, 0.25);
    }

    .legend {
      margin-top: 18px;
      padding: 13px 15px;
      border-radius: 14px;
      background: #fff9db;
      color: #805d05;
      font-size: 13px;
      line-height: 2;
    }

    body.dark .legend {
      background: #382d0d;
      color: #fde68a;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .btn {
      border: none;
      border-radius: 13px;
      padding: 13px 17px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 8px 18px rgba(22, 150, 93, 0.22);
    }

    .btn-secondary {
      color: var(--text);
      background: var(--surface-soft);
      border: 1px solid var(--border);
    }

    textarea {
      min-height: 210px;
      padding: 16px;
      resize: vertical;
      line-height: 2;
      direction: rtl;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin: 18px 0 0;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translate(-50%, 120px);
      z-index: 10;
      width: min(350px, calc(100% - 34px));
      text-align: center;
      padding: 13px 16px;
      border-radius: 13px;
      background: #17251d;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
      transition: transform 0.3s ease;
      font-size: 14px;
    }

    .toast.show {
      transform: translate(-50%, 0);
    }

    @media (max-width: 650px) {
      .container {
        width: min(100% - 20px, 920px);
        padding-top: 15px;
      }

      .card {
        padding: 16px;
        border-radius: 20px;
      }

      .form-grid,
      .prayers-grid {
        grid-template-columns: 1fr;
      }

      .hero {
        align-items: flex-start;
      }

      .theme-btn {
        padding: 9px 10px;
      }

      .actions .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="hero">
      <div class="brand">
        <div class="lemon">🍋</div>
        <div>
          <h1>گزارش نماز لیمو شیرین</h1>
          <p class="subtitle">ثبت سریع و مرتب گزارش روزانه</p>
        </div>
      </div>

      <button class="theme-btn" onclick="toggleTheme()" id="themeButton">
        🌙 تم تیره
      </button>
    </header>

    <section class="card">
      <div class="form-grid">
        <div>
          <label for="nameSelect">نام</label>
          <select id="nameSelect" onchange="toggleCustom('name')">
            <option value="">انتخاب کنید</option>
            <option>امیرمحمد</option>
            <option>طاها</option>
            <option>مهدی</option>
            <option>معین</option>
            <option>دانیال</option>
            <option>محمدرضا</option>
            <option>علی</option>
            <option>محمدحسن</option>
            <option>محمدابوذر</option>
            <option>حسین</option>
            <option>محمد_علیجانی</option>
            <option value="سایر">سایر</option>
          </select>
        </div>

        <div>
          <label for="timeSelect">زمان گزارش</label>
          <select id="timeSelect" onchange="toggleCustom('time')">
            <option value="">انتخاب کنید</option>
            <option>پریروز</option>
            <option>دیروز</option>
            <option>امروز</option>
            <option value="سایر">سایر</option>
          </select>
        </div>

        <div id="customNameBox" class="hidden">
          <label for="customName">نام دلخواه</label>
          <input id="customName" type="text" placeholder="نام را وارد کنید" />
        </div>

        <div id="customTimeBox" class="hidden">
          <label for="customTime">زمان دلخواه</label>
          <input id="customTime" type="text" placeholder="مثلاً سه روز پیش" />
        </div>
      </div>

      <div class="progress-box">
        <div class="progress-head">
          <span>میزان تکمیل گزارش</span>
          <span id="progressText">۰ از ۵ نماز</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="section-title">وضعیت نمازها</div>

      <div class="period">
        <h2 class="period-title">صبح</h2>
        <div class="prayers-grid">
          <div class="prayer">
            <p class="prayer-name">نماز صبح</p>
            <div class="status-buttons" data-prayer="sobh">
              <button class="status-btn" data-value="✅">✅ جماعت</button>
              <button class="status-btn" data-value="☑️">☑️ فرادا</button>
              <button class="status-btn" data-value="❌">❌ نخواندم</button>
              <button class="status-btn" data-value="❌☑️">❌☑️ قضا کردم</button>
            </div>
          </div>
        </div>
      </div>

      <div class="period">
        <h2 class="period-title">ظهر</h2>
        <div class="prayers-grid">
          <div class="prayer">
            <p class="prayer-name">نماز ظهر</p>
            <div class="status-buttons" data-prayer="zohr">
              <button class="status-btn" data-value="✅">✅ جماعت</button>
              <button class="status-btn" data-value="☑️">☑️ فرادا</button>
              <button class="status-btn" data-value="❌">❌ نخواندم</button>
              <button class="status-btn" data-value="❌☑️">❌☑️ قضا کردم</button>
            </div>
          </div>

          <div class="prayer">
            <p class="prayer-name">نماز عصر</p>
            <div class="status-buttons" data-prayer="asr">
              <button class="status-btn" data-value="✅">✅ جماعت</button>
              <button class="status-btn" data-value="☑️">☑️ فرادا</button>
              <button class="status-btn" data-value="❌">❌ نخواندم</button>
              <button class="status-btn" data-value="❌☑️">❌☑️ قضا کردم</button>
            </div>
          </div>
        </div>
      </div>

      <div class="period">
        <h2 class="period-title">شب</h2>
        <div class="prayers-grid">
          <div class="prayer">
            <p class="prayer-name">نماز مغرب</p>
            <div class="status-buttons" data-prayer="maghrib">
              <button class="status-btn" data-value="✅">✅ جماعت</button>
              <button class="status-btn" data-value="☑️">☑️ فرادا</button>
              <button class="status-btn" data-value="❌">❌ نخواندم</button>
              <button class="status-btn" data-value="❌☑️">❌☑️ قضا کردم</button>
            </div>
          </div>

          <div class="prayer">
            <p class="prayer-name">نماز عشاء</p>
            <div class="status-buttons" data-prayer="esha">
              <button class="status-btn" data-value="✅">✅ جماعت</button>
              <button class="status-btn" data-value="☑️">☑️ فرادا</button>
              <button class="status-btn" data-value="❌">❌ نخواندم</button>
              <button class="status-btn" data-value="❌☑️">❌☑️ قضا کردم</button>
            </div>
          </div>
        </div>
      </div>

      <div class="legend">
        ✅ جماعت &nbsp; | &nbsp; ☑️ فرادا &nbsp; | &nbsp;
        ❌ نخوانده شده &nbsp; | &nbsp; ❌☑️ بعداً قضا شده
      </div>

      <div class="actions">
  <button class="btn btn-primary" onclick="generateReport()">ساخت گزارش</button>

  <button class="btn btn-secondary" onclick="sendToEitaa()" id="sendEitaaButton">
    ارسال به ایتا 📤
  </button>

  <button class="btn btn-secondary" onclick="copyReport()">کپی گزارش</button>
  <button class="btn btn-secondary" onclick="newForm()">فرم جدید</button>
</div>

    </section>

    <section class="card" id="outputCard">
      <div class="section-title">خروجی گزارش</div>
      <textarea id="output" readonly placeholder="بعد از زدن دکمه «ساخت گزارش»، متن اینجا نمایش داده می‌شود..."></textarea>
      <div class="footer">طراحی شده برای گروه لیمو شیرین 🍋</div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const prayerStatus = {
      sobh: "",
      zohr: "",
      asr: "",
      maghrib: "",
      esha: ""
    };

    document.querySelectorAll(".status-btn").forEach(button => {
      button.addEventListener("click", function () {
        const group = this.parentElement;
        const prayer = group.dataset.prayer;

        group.querySelectorAll(".status-btn").forEach(btn => {
          btn.classList.remove("active");
        });

        this.classList.add("active");
        prayerStatus[prayer] = this.dataset.value;
        updateProgress();
      });
    });

    function toggleCustom(type) {
      const select = document.getElementById(type + "Select");
      const box = document.getElementById(
        type === "name" ? "customNameBox" : "customTimeBox"
      );

      box.classList.toggle("hidden", select.value !== "سایر");
    }

    function updateProgress() {
      const count = Object.values(prayerStatus).filter(value => value !== "").length;
      document.getElementById("progressText").textContent =
        `${toPersianNumber(count)} از ۵ نماز`;
      document.getElementById("progressFill").style.width = `${count * 20}%`;
    }

    function toPersianNumber(number) {
      return String(number).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
    }

    function getName() {
      const selected = document.getElementById("nameSelect").value;
      return selected === "سایر"
        ? document.getElementById("customName").value.trim()
        : selected;
    }

    function getTime() {
      const selected = document.getElementById("timeSelect").value;
      return selected === "سایر"
        ? document.getElementById("customTime").value.trim()
        : selected;
    }

    function generateReport() {
      const name = getName();
      const time = getTime();

      if (!name) {
        showToast("لطفاً نام را انتخاب یا وارد کن.");
        return;
      }

      if (!time) {
        showToast("لطفاً زمان گزارش را انتخاب یا وارد کن.");
        return;
      }

      const incomplete = [];

      if (!prayerStatus.sobh) incomplete.push("صبح");
      if (!prayerStatus.zohr || !prayerStatus.asr) incomplete.push("ظهر");
      if (!prayerStatus.maghrib || !prayerStatus.esha) incomplete.push("شب");

      if (incomplete.length > 0) {
        const confirmText =
          `وعده ${incomplete.join(" و ")} کامل ثبت نشده. حواست هست؟`;

        if (!confirm(confirmText)) return;
      }

      const report = `سلام
بسم الله الرحمن الرحیم
#${name}   |   ${time}
صبح ${prayerStatus.sobh || "—"}
ظهر ${(prayerStatus.zohr || "—") + (prayerStatus.asr || "—")}
شب ${(prayerStatus.maghrib || "—") + (prayerStatus.esha || "—")}`;

      document.getElementById("output").value = report;
      document.getElementById("outputCard").scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

      showToast("گزارش آماده شد ✅");
    }

    function copyReport() {
      const output = document.getElementById("output");

      if (!output.value.trim()) {
        showToast("اول گزارش را بساز.");
        return;
      }

      navigator.clipboard.writeText(output.value)
        .then(() => showToast("گزارش کپی شد ✅"))
        .catch(() => {
          output.select();
          document.execCommand("copy");
          showToast("گزارش کپی شد ✅");
        });
    }

    function newForm() {
      const hasData =
        getName() ||
        getTime() ||
        Object.values(prayerStatus).some(value => value) ||
        document.getElementById("output").value;

      if (hasData && !confirm("فرم پاک شود و یک گزارش جدید بسازی؟")) return;

      document.getElementById("nameSelect").value = "";
      document.getElementById("timeSelect").value = "";
      document.getElementById("customName").value = "";
      document.getElementById("customTime").value = "";
      document.getElementById("customNameBox").classList.add("hidden");
      document.getElementById("customTimeBox").classList.add("hidden");
      document.getElementById("output").value = "";

      Object.keys(prayerStatus).forEach(key => {
        prayerStatus[key] = "";
      });

      document.querySelectorAll(".status-btn").forEach(btn => {
        btn.classList.remove("active");
      });

      updateProgress();
      window.scrollTo({ top: 0, behavior: "smooth" });
      showToast("فرم جدید آماده است 🍋");
    }
async function sendToEitaa() {
  const output = document.getElementById("output");
  const sendButton = document.getElementById("sendEitaaButton");

  // اگر گزارش هنوز ساخته نشده، اول آن را بساز
  if (!output.value.trim()) {
    generateReport();
  }

  // اگر گزارش ساخته نشد، ادامه نده
  if (!output.value.trim()) return;

  const confirmSend = confirm(
    "این گزارش به ایتا ارسال شود؟\n\n" + output.value
  );

  if (!confirmSend) return;

  const TOKEN = "bot34501:8059ceb1-39fb-455a-a3f8-f7f1def8b5e6";

  /*
    برای تست می‌توانی لینک دعوت را به‌صورت متن بگذاری.
    ولی اگر API آن را قبول نکند، باید chat_id واقعی/عددی را پیدا کنی.
  */
  const CHAT_ID = "https://eitaa.com/joinchat/1079248149Cc20514565f";

  const apiUrl = `https://eitaayar.ir/api/${TOKEN}/sendMessage`;

  sendButton.disabled = true;
  sendButton.textContent = "در حال ارسال...";

  try {
    const formData = new FormData();
    formData.append("chat_id", CHAT_ID);
    formData.append("text", output.value);
    formData.append("title", "گزارش نماز لیمو شیرین");

    const response = await fetch(apiUrl, {
      method: "POST",
      body: formData
    });

    const rawResult = await response.text();

    console.log("وضعیت HTTP:", response.status);
    console.log("پاسخ کامل ایتا:", rawResult);

    let result;

    try {
      result = JSON.parse(rawResult);
    } catch {
      result = null;
    }

    // پاسخ ناموفق HTTP
    if (!response.ok) {
      throw new Error(`خطای سرور ایتا (${response.status}): ${rawResult}`);
    }

    // پاسخ JSON ناموفق از API
    if (result && result.ok === false) {
      throw new Error(
        result.description ||
        result.message ||
        JSON.stringify(result)
      );
    }

    // اگر پاسخ قابل‌تشخیص نبود
    if (!result && !rawResult.toLowerCase().includes("success")) {
      throw new Error(rawResult || "پاسخ نامشخص از ایتا دریافت شد.");
    }

    showToast("گزارش با موفقیت به ایتا ارسال شد ✅");

  } catch (error) {
    console.error("خطای کامل ارسال:", error);

    showToast(
      "ارسال ناموفق بود: " + error.message.slice(0, 120)
    );
  } finally {
    sendButton.disabled = false;
    sendButton.textContent = "ارسال به ایتا 📤";
  }
}


    function toggleTheme() {
      document.body.classList.toggle("dark");

      const isDark = document.body.classList.contains("dark");
      document.getElementById("themeButton").textContent =
        isDark ? "☀️ تم روشن" : "🌙 تم تیره";

      localStorage.setItem("limoTheme", isDark ? "dark" : "light");
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2600);
    }

    if (localStorage.getItem("limoTheme") === "dark") {
      document.body.classList.add("dark");
      document.getElementById("themeButton").textContent = "☀️ تم روشن";
    }

    updateProgress();
  </script>
</body>
</html>
